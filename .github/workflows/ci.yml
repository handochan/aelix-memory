name: Memory quality and host integration
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -m 'not host' -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python tools/evaluate_retrieval.py
      - run: uv build

  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: handochan/aelix-ai
          ref: dfb4ddccd18af937bc46a423babf9e46a3a0e63f
          path: .host-src
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv pip install .host-src/packages/aelix-ai .host-src/packages/aelix-agent-core ".host-src/packages/aelix-coding-agent[tui]"
      - run: uv run pyright
      - run: uv build
      - run: uv run python tools/install_ci_wheel.py
      - run: uv run --no-sync aelix extension verify aelix-memory
      - run: uv run --no-sync pytest -m host -q

  released-host-panel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv pip install 'aelix[tui]==0.1.0b2'
      - run: uv build
      - run: uv run python tools/install_ci_wheel.py
      - run: uv run --no-sync aelix extension verify aelix-memory
      - run: uv run --no-sync pytest tests/test_host.py -k 'bare_memory or headless_bare or panel_and_read or manual_action' -q
      - run: uv run --no-sync pytest tests/test_prompt_cache_host.py -q
