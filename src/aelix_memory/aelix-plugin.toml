[plugin]
id = "aelix-memory"
name = "Aelix Memory"
version = "0.4.0"
description = "Enable memory globally once; learn and recall project knowledge automatically"
authors = ["Aelix Contributors"]
repository = "https://github.com/handochan/aelix-memory"
license = "Apache-2.0"

[plugin.api]
level = 1
min_level = 1

[plugin.entry]
python = "aelix_memory:setup"

[capabilities]
fs_write = true
fs_read_user = true
shell_exec = false
net = true
ui_tui_trusted = false

[activation]
on_startup_finished = true
on_command = ["memory"]

[[contributes.commands]]
id = "memory"
description = "Open the memory control panel; set global usage and manage project memories"
